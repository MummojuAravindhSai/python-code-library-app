---
services:
  db:
    image: aravindhsaimummoju/flm-python_app_deploy:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    deploy:
      replicas: 1

  auth_service:
    image: aravindhsaimummoju/flm-python_app_deploy:auth
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    deploy:
      replicas: 2

  book_service:
    image: aravindhsaimummoju/flm-python_app_deploy:book
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    deploy:
      replicas: 2

  borrow_service:
    image: aravindhsaimummoju/flm-python_app_deploy:borrow
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    deploy:
      replicas: 2

  frontend:
    image: aravindhsaimummoju/flm-python_app_deploy:frontend
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    deploy:
      replicas: 2

networks:
  mynetwork:
    driver: overlay
