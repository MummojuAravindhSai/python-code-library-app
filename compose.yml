---
services:
  db:
    build: ./database
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    deploy:
      replicas: 2

  auth_service:
    build: ./auth
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    deploy:
      replicas: 2

  book_service:
    build: ./book
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
    deploy:
      replicas: 2

  borrow_service:
    build: ./borrow
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db
    deploy:
      replicas: 2

  frontend:
    build: .
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service
    deploy:
      replicas: 2

networks:
  mynetwork:
    driver: overlay
