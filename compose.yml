---
services:
  db:
    image: aravindhsaimummoju/flm-python_app_deploy:db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp

  auth_service:
    image: aravindhsaimummoju/flm-python_app_deploy:auth
    ports:
      - "5001:5001"
    networks:
      - myapp

  book_service:
    image: aravindhsaimummoju/flm-python_app_deploy:book
    ports:
      - "5002:5002"
    networks:
      - myapp

  borrow_service:
    image: aravindhsaimummoju/flm-python_app_deploy:borrow
    ports:
      - "5003:5003"
    networks:
      - myapp

  frontend_service:
    image: aravindhsaimummoju/flm-python_app_deploy:frontend
    ports:
      - "5000:5000"
    networks:
      - myapp

networks:
  myapp:
    driver: overlay

volumes:
  mydata:
