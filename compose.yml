```yaml
services:
  db:
    image: aravindhsaimummoju/flm-python_app_deploy:db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.125"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    image: aravindhsaimummoju/flm-python_app_deploy:auth
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.125"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  book_service:
    image: aravindhsaimummoju/flm-python_app_deploy:book
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.125"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    image: aravindhsaimummoju/flm-python_app_deploy:borrow
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
